<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Package – WanderLust</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="fas fa-plane me-2"></i>WanderLust</a>
    <div class="ms-auto d-flex gap-3 align-items-center">
      <a class="nav-link" href="packages.html">Packages</a>
      <span id="authNav"><a href="login.html" class="nav-link"><i class="fas fa-user me-1"></i>Login</a></span>
      <button class="theme-toggle" onclick="toggleTheme()"></button>
    </div>
  </div>
</nav>

<div class="container py-5">
  <h1 class="section-title mb-4">Book Your Trip</h1>
  <div class="row g-4">
    <div class="col-lg-7">
      <!-- Package Selection -->
      <div class="booking-step">
        <h5 class="fw-700 mb-3"><span class="step-num me-2" style="width:28px;height:28px;background:var(--primary);color:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;">1</span>Select Package</h5>
        <select class="form-select mb-3" id="pkgSelect" onchange="updateSummary()">
          <option value="">-- Choose a Package --</option>
        </select>
      </div>
      <!-- Traveller Details -->
      <div class="booking-step">
        <h5 class="fw-700 mb-3"><span class="step-num me-2" style="width:28px;height:28px;background:var(--primary);color:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;">2</span>Traveller Details</h5>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Lead Traveller Name *</label><input type="text" class="form-control" id="travName" required placeholder="John Doe"/></div>
          <div class="col-md-6"><label class="form-label">Email *</label><input type="email" class="form-control" id="travEmail" required placeholder="you@email.com"/></div>
          <div class="col-md-6"><label class="form-label">Phone *</label><input type="tel" class="form-control" id="travPhone" required placeholder="9876543210"/></div>
          <div class="col-md-3"><label class="form-label">Adults *</label><select class="form-select" id="adults" onchange="updateSummary()"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
          <div class="col-md-3"><label class="form-label">Children</label><select class="form-select" id="children" onchange="updateSummary()"><option>0</option><option>1</option><option>2</option><option>3</option></select></div>
          <div class="col-md-6"><label class="form-label">Travel Date *</label><input type="date" class="form-control" id="tDate" required/></div>
          <div class="col-md-6"><label class="form-label">Return Date</label><input type="date" class="form-control" id="rDate"/></div>
          <div class="col-12"><label class="form-label">Special Requests</label><textarea class="form-control" id="requests" rows="2" placeholder="Any special requirements…"></textarea></div>
        </div>
      </div>
      <!-- Payment -->
      <div class="booking-step">
        <h5 class="fw-700 mb-3"><span class="step-num me-2" style="width:28px;height:28px;background:var(--primary);color:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;">3</span>Payment</h5>
        <div class="row g-3">
          <div class="col-12">
            <div class="d-flex gap-3 flex-wrap">
              <label class="d-flex align-items-center gap-2 p-3 rounded-xl" style="border:2px solid var(--border-color);cursor:pointer;flex:1;min-width:120px;background:var(--bg-card);">
                <input type="radio" name="payment" value="upi" checked/> 📱 UPI
              </label>
              <label class="d-flex align-items-center gap-2 p-3 rounded-xl" style="border:2px solid var(--border-color);cursor:pointer;flex:1;min-width:120px;background:var(--bg-card);">
                <input type="radio" name="payment" value="card"/> 💳 Card
              </label>
              <label class="d-flex align-items-center gap-2 p-3 rounded-xl" style="border:2px solid var(--border-color);cursor:pointer;flex:1;min-width:120px;background:var(--bg-card);">
                <input type="radio" name="payment" value="netbanking"/> 🏦 Net Banking
              </label>
            </div>
          </div>
        </div>
        <div class="alert alert-warning small mt-3">
          <i class="fas fa-exclamation-triangle me-1"></i>Demo payment – no real transaction will be processed.
        </div>
      </div>
    </div>

    <!-- Booking Summary -->
    <div class="col-lg-5">
      <div class="summary-card" id="bookingSummary">
        <h5 class="fw-700 mb-4"><i class="fas fa-receipt me-2 text-primary"></i>Booking Summary</h5>
        <div id="summaryContent">
          <div class="empty-state" style="padding:30px 0;">
            <i class="fas fa-suitcase" style="font-size:2.5rem;display:block;margin-bottom:10px;color:var(--text-muted);"></i>
            <p class="text-muted">Select a package to see summary</p>
          </div>
        </div>
        <div id="errBooking" class="d-none"></div>
        <button class="btn-primary-custom mt-3 d-none" id="bookBtn" onclick="confirmBooking()">
          <span id="bookSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
          <i class="fas fa-check me-2"></i>Confirm Booking
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<!-- Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:var(--bg-card);color:var(--text-primary);">
      <div class="modal-body text-center py-5">
        <div style="font-size:4rem;">🎉</div>
        <h4 class="fw-800 mt-3">Booking Confirmed!</h4>
        <p class="text-muted">Your trip has been booked successfully.</p>
        <div style="background:var(--bg-primary);border:2px dashed var(--border-color);border-radius:12px;padding:16px;margin:20px 0;">
          <div class="small text-muted mb-1">Booking Reference</div>
          <div class="fw-800 fs-4 text-primary" id="bookRef"></div>
        </div>
        <a href="index.html" class="btn btn-primary rounded-pill px-4">Go to Home</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    checkAuth();
    // Populate package select
    const sel = document.getElementById('pkgSelect');
    PACKAGES.forEach(p => sel.innerHTML += `<option value="${p.id}">${p.name} – ${p.duration} (₹${p.price.toLocaleString()}/person)</option>`);
    // Auto-select from URL
    const pid = new URLSearchParams(window.location.search).get('pid');
    if (pid) { sel.value = pid; updateSummary(); }
    // Min date
    document.getElementById('tDate').min = new Date().toISOString().split('T')[0];
  });

  function updateSummary() {
    const pid = document.getElementById('pkgSelect').value;
    const adults = parseInt(document.getElementById('adults').value);
    const children = parseInt(document.getElementById('children').value);
    const content = document.getElementById('summaryContent');
    const bookBtn = document.getElementById('bookBtn');

    if (!pid) {
      content.innerHTML = `<div class="empty-state" style="padding:30px 0;"><i class="fas fa-suitcase" style="font-size:2.5rem;display:block;margin-bottom:10px;color:var(--text-muted);"></i><p class="text-muted">Select a package to see summary</p></div>`;
      bookBtn.classList.add('d-none');
      return;
    }

    const pkg = PACKAGES.find(p => p.id == pid);
    const adultTotal = pkg.price * adults;
    const childTotal = Math.round(pkg.price * 0.6 * children);
    const grandTotal = adultTotal + childTotal;

    content.innerHTML = `
      <img src="${pkg.image}" alt="${pkg.name}" style="width:100%;height:150px;object-fit:cover;border-radius:10px;margin-bottom:16px;"/>
      <h6 class="fw-700">${pkg.name}</h6>
      <div class="text-muted small mb-3"><i class="fas fa-clock me-1"></i>${pkg.duration} · <i class="fas fa-map-marker-alt me-1"></i>${pkg.destination}</div>
      <div class="mb-3"><div class="fw-600 small mb-2">Includes:</div>
        ${pkg.includes.map(i=>`<div class="small text-muted"><i class="fas fa-check text-success me-2"></i>${i}</div>`).join('')}
      </div>
      <hr/>
      <div style="display:flex;justify-content:space-between;padding:6px 0;color:var(--text-secondary);"><span>${adults} Adult(s) × ₹${pkg.price.toLocaleString()}</span><span>₹${adultTotal.toLocaleString()}</span></div>
      ${children>0?`<div style="display:flex;justify-content:space-between;padding:6px 0;color:var(--text-secondary);"><span>${children} Child(ren) × ₹${Math.round(pkg.price*.6).toLocaleString()}</span><span>₹${childTotal.toLocaleString()}</span></div>`:''}
      <div style="display:flex;justify-content:space-between;padding:12px 0 0;font-size:1.1rem;font-weight:700;border-top:1px solid var(--border-color);margin-top:6px;color:var(--text-primary);"><span>Total</span><span class="text-primary">₹${grandTotal.toLocaleString()}</span></div>`;
    bookBtn.classList.remove('d-none');
  }

  function confirmBooking() {
    const pid = document.getElementById('pkgSelect').value;
    const name = document.getElementById('travName').value.trim();
    const email = document.getElementById('travEmail').value.trim();
    const phone = document.getElementById('travPhone').value.trim();
    const date = document.getElementById('tDate').value;

    if (!pid || !name || !email || !phone || !date) { showToast('Please fill all required fields.', 'danger'); return; }

    const sp = document.getElementById('bookSpinner');
    sp.classList.remove('d-none');
    setTimeout(() => {
      sp.classList.add('d-none');
      const ref = 'WL' + Date.now().toString().slice(-8).toUpperCase();
      document.getElementById('bookRef').textContent = ref;
      new bootstrap.Modal(document.getElementById('confirmModal')).show();
    }, 2000);
  }
</script>
</body>
</html>
